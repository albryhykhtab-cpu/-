<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | CAR ZONE</title>

    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="https://kit.fontawesome.com/cdfec64960.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="login-card">
    <div class="form-side">
        <div class="form-title">
            <p>مرحباً بعودتك</p>
            <h1>تسجيل الدخول</h1>
            <h4>أدخل البريد الإلكتروني وكلمة المرور.</h4>
        </div>

        <form id="loginForm" novalidate>
            <label for="loginEmail">البريد الإلكتروني</label>
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="example@gmail.com">
            </div>

            <label for="loginPassword">كلمة المرور</label>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="8 أحرف على الأقل">
                <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </div>

            <div class="remember-row">
                <div>
                    <input type="checkbox" id="remember">
                    <label for="remember">تذكرني</label>
                </div>
                <a href="sign.html">إنشاء حساب</a>
            </div>

            <div id="message"></div>
            <button class="login-button" type="submit">تسجيل الدخول</button>
        </form>
    </div>

    <div class="login-info">
        <a href="../index.html" class="back-home">← العودة إلى الرئيسية</a>
        <div>
            <h2>CAR <span>ZONE</span></h2>
            <h1>اختر سيارتك<br>بسهولة</h1>
            <p>سجّل دخولك لمتابعة السيارات والتواصل مع المعرض.</p>
        </div>
        <img src="../img/hero-car.jpg" alt="سيارة">
    </div>
</div>

<script src="../js/jquery.min.js"></script>
<script src="../js/bootstrap.bundle.min.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
