<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | CAR ZONE</title>

    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/contact.css">
    <!-- <script src="https://kit.fontawesome.com/cdfec64960.js" crossorigin="anonymous"></script> -->
     <link rel="stylesheet" href="../lebrary icon/all.min.css">
</head>
<body>

<header class="site-header">
    <div class="page-width header-row">
        <a class="logo" href="../index.html"><i class="fa-solid fa-car-side"></i> CAR ZONE</a>
        <nav class="main-nav">
            <a href="../index.html">الرئيسية</a>
            <a href="cars.html">السيارات</a>
            <a href="about.html">من نحن</a>
            <a class="active" href="contact.html">تواصل معنا</a>
        </nav>
        <a class="login-link" href="login.html">تسجيل الدخول</a>
    </div>
</header>

<main class="page-width contact-page">
    <section class="page-heading">
        <h1>تواصل معنا</h1>
        <p>أرسل استفسارك عن أي سيارة وسنرد عليك.</p>
    </section>

    <section class="contact-grid">
        <div class="contact-info">
            <h2>معلومات التواصل</h2>

            <div class="info-line">
                <i class="fa-solid fa-phone"></i>
                <div><h3>الهاتف</h3><p>+967 770 000 000</p></div>
            </div>

            <div class="info-line">
                <i class="fa-solid fa-envelope"></i>
                <div><h3>البريد</h3><p>cars@example.com</p></div>
            </div>

            <div class="info-line">
                <i class="fa-solid fa-location-dot"></i>
                <div><h3>الموقع</h3><p>صنعاء - اليمن</p></div>
            </div>

            <div class="contact-social">
                <a href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>

        <form class="contact-form">
            <h2>أرسل رسالة</h2>
            <label for="name">الاسم</label>
            <input id="name" type="text" placeholder="اكتب اسمك" required>

            <label for="email">البريد الإلكتروني</label>
            <input id="email" type="email" placeholder="example@gmail.com" required>

            <label for="subject">الموضوع</label>
            <input id="subject" type="text" placeholder="مثال: استفسار عن كامري">

            <label for="message">الرسالة</label>
            <textarea id="message" rows="5" placeholder="اكتب رسالتك"></textarea>

            <button type="submit">إرسال</button>
        </form>
    </section>
</main>

<footer class="site-footer">
    <div class="page-width footer-row">
        <p>© 2026 CAR ZONE - جميع الحقوق محفوظة</p>
        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </div>
</footer>

<script src="../js/jquery.min.js"></script>
<script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
